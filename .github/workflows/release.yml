# A version tag (vMAJOR.MINOR.PATCH, created by release-please when its release PR is merged):
# build the API image for linux/amd64, push it to GHCR, point the Hugging Face Space at it by
# tag and digest, then wait until the live Space serves that version and /ready passes. If it
# does not, the workflow fails (ADR 0034).
#
# Run by hand (workflow_dispatch) to redeploy an image that is already in GHCR, e.g. after a
# change to conf/deploy/space.yaml: the image is not rebuilt, its digest is looked up.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to redeploy (vMAJOR.MINOR.PATCH, already in GHCR)"
        required: true

permissions:
  contents: read

# One deploy at a time; a second waits instead of cancelling one that is half done.
concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.24"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  image:
    name: Push the API image to GHCR (linux/amd64)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      # /health reports the package version, and the deploy waits for the tag's: a tag that
      # does not match pyproject.toml would never pass, so fail before building.
      - name: Tag matches the package version
        run: |
          version="$(uv version --short)"
          test "v${version}" = "$TAG" || { echo "tag $TAG, pyproject.toml $version" >&2; exit 1; }
      - run: uv sync --locked --no-dev
      - id: image
        run: uv run --no-sync python -m api.deploy.space outputs >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ env.TAG }}
            ${{ steps.image.outputs.image }}:sha-${{ github.sha }}
          push: true
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max
      - name: Summary
        run: |
          echo "Pushed \`${{ steps.image.outputs.image }}:$TAG@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to the Hugging Face Space
    needs: [image]
    # On a tag, only after the push succeeded; by hand, without a build.
    if: always() && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.image.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: huggingface-space
      url: ${{ steps.space.outputs.url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      # The deploy needs only the API's light base dependencies (huggingface_hub, httpx).
      - run: uv sync --locked --no-dev
      - id: space
        run: uv run --no-sync python -m api.deploy.space outputs >> "$GITHUB_OUTPUT"
      - name: Image digest
        id: digest
        env:
          BUILT: ${{ needs.image.outputs.digest }}
        run: |
          if [ -n "$BUILT" ]; then
            echo "digest=$BUILT" >> "$GITHUB_OUTPUT"
          else
            digest="$(docker buildx imagetools inspect "${{ steps.space.outputs.image }}:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi
      - name: Point the Space at the image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_METRICS_TOKEN: ${{ secrets.SPACE_METRICS_TOKEN }}
        run: uv run --no-sync python -m api.deploy.space deploy --tag "$TAG" --digest "${{ steps.digest.outputs.digest }}"
      - name: Wait for /ready on the live Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --no-sync python -m api.deploy.space wait --tag "$TAG"
