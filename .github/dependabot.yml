# Dependabot (ADR 0034): weekly, grouped, so the update PRs stay few. Each PR runs the full CI
# and needs it green, like any other. Python uses the `uv` ecosystem, which updates uv.lock
# (the `pip` ecosystem would edit pyproject.toml and leave the lock stale, and CI's
# `uv sync --locked` would fail).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  # The separate tool environments (Locust; optimum's ONNX exporter, which needs
  # transformers < 4.58: majors there are deliberate, ADR 0029).
  - package-ecosystem: uv
    directories: [/tools/loadtest, /tools/onnx-export]
    schedule:
      interval: monthly
    groups:
      tools:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "build(deps)"

  # The website (ADR 0037): exact pins in web/package.json, pnpm-lock.yaml updated with them.
  # TypeScript stays on 5.x (openapi-typescript's peer range) and ESLint on 9.x
  # (eslint-config-next's plugins) until those move; their majors are not proposed.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # Base images, by tag and digest. Python stays on 3.11 (CLAUDE.md): only patch updates and
  # digest refreshes (Debian security fixes) of python:3.11.x-slim-trixie.
  - package-ecosystem: docker
    directories: [/api, /pipeline]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "build(docker)"
