# Benchmark figures (`mutascope eval figures`, ADR 0016). Every number in a figure is read from
# a results file: a score set's own summary, the shared-assay summary (eval.shared_summary) or
# the paired comparisons (eval.comparisons). A figure that needs a pair missing from
# eval.comparisons fails; nothing is computed while drawing.
figures:
  metric: spearman
  formats: [svg, png]
  dpi: 200
  # Score-set label -> name shown in figures.
  names:
    esm2_35m: ESM-2 35M
    esm2_150m: ESM-2 150M
    esm2_650m: ESM-2 650M
    saprot_650m_af2: SaProt 650M
    ensemble_esm2_650m_saprot_650m_af2: Ensemble
  # Model size vs the metric: masked-marginal score set -> parameters in millions (nominal, from
  # the checkpoint names esm2_t12_35M, esm2_t30_150M, esm2_t33_650M), smallest first. Each step
  # [larger, smaller] must be in eval.comparisons.
  model_size:
    esm2_35m: 35
    esm2_150m: 150
    esm2_650m: 650
  # Bars per function type, from the shared-assay summary.
  function_types: ${eval.shared_summary}
  # Paired differences A - B, one panel per pair; each must be in eval.comparisons.
  ensemble_gain:
    - [ensemble_esm2_650m_saprot_650m_af2, saprot_650m_af2]
    - [ensemble_esm2_650m_saprot_650m_af2, esm2_650m]
  fast_vs_masked:
    - [esm2_35m, esm2_35m_wt]
    - [esm2_150m, esm2_150m_wt]
    - [esm2_650m, esm2_650m_wt]
