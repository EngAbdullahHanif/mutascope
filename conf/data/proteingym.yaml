# ProteinGym release pin. Do not change without an ADR (see CLAUDE.md, "Data rules").
#
# Source of truth: Zenodo record for v1.3 (DOI below). Files are downloaded from the Marks lab
# mirror, which serves byte-identical copies (sizes verified equal on 2026-10-09). `md5` is the
# checksum Zenodo publishes for each file; the downloader verifies it on first fetch and records
# sha256 in `manifest_path`, which is what every later run verifies against.
release:
  version: v1.3
  zenodo_doi: 10.5281/zenodo.15293562
  zenodo_record: https://zenodo.org/records/15293562
  # Git tag PG_v1.3 in OATML-Markslab/ProteinGym, resolved to its commit for immutability.
  git_repo: https://github.com/OATML-Markslab/ProteinGym
  git_tag: PG_v1.3
  git_commit: 1f8de974dead8ff7501eff087b725d14a965e9f9

base_url: https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3
benchmarks_url: https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/${data.release.git_commit}/benchmarks/DMS_zero_shot/substitutions
supervised_benchmarks_url: https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/${data.release.git_commit}/benchmarks/DMS_supervised/substitutions
data_dir: ${oc.env:MUTASCOPE_DATA_DIR,data}
raw_dir: ${data.data_dir}/raw/proteingym_${data.release.version}
manifest_path: ${data.data_dir}/manifest.yaml
# Outputs of `make pipeline` (Nextflow params processed_dir / reports_dir), read by the EDA notebook
# and `mutascope data publish`.
processed_dir: ${data.data_dir}/processed
reports_dir: results/data

# Each entry lands in `raw_dir`. Archives are extracted to `raw_dir/<filename stem>/` (flattened to
# file basenames). With `to_parquet`, only the listed columns are kept (cast to the given type),
# written as Parquet partitioned by assay_id, and the archive is deleted afterwards.
files:
  reference:
    # One row per assay (217): target_seq, UniProt_ID, coarse_selection_type, pdb_file, pdb_range...
    filename: DMS_substitutions.csv
    url: ${data.base_url}/DMS_substitutions.csv
    size_bytes: 208734
    md5: c434631737013fceb56efc98056151e0
    archive: false
  dms_substitutions:
    # 217 CSVs: mutant, mutated_sequence, DMS_score, DMS_score_bin (singles + multiples).
    filename: DMS_ProteinGym_substitutions.zip
    url: ${data.base_url}/DMS_ProteinGym_substitutions.zip
    size_bytes: 43021128
    md5: ca1a4d46941ef33cc972245347118c7d
    archive: true
  cv_folds_singles:
    # 217 CSVs: DMS columns + fold_random_5, fold_modulo_5, fold_contiguous_5.
    filename: cv_folds_singles_substitutions.zip
    url: ${data.base_url}/cv_folds_singles_substitutions.zip
    size_bytes: 13412036
    md5: 53b3c9be428aac3724703a877c014f9c
    archive: true
  af2_structures:
    # 197 PDBs matched to DMS target sequences (+ a stray .DS_Store, skipped on extract).
    filename: ProteinGym_AF2_structures.zip
    url: ${data.base_url}/ProteinGym_AF2_structures.zip
    size_bytes: 19173248
    md5: 442881616899de02cd1c1b0a57badd37
    archive: true
  zero_shot_scores:
    # 217 CSVs, one column per baseline. Needed for the Phase 2 reproduction gate. The per-assay
    # layout means there is no per-model subset to fetch, so we take the whole 1.9 GB once.
    filename: zero_shot_substitutions_scores.zip
    url: ${data.base_url}/zero_shot_substitutions_scores.zip
    size_bytes: 1911045703
    md5: 7912b6a1f6c80b0b78c12a15c84d96fc
    archive: true
    to_parquet:
      # column -> DuckDB type. CSVs are read as text and cast, so a malformed value fails loudly
      # and every assay gets the same Parquet schema.
      columns:
        mutant: VARCHAR
        DMS_score: DOUBLE
        DMS_score_bin: INTEGER
        ESM2_8M: DOUBLE
        ESM2_35M: DOUBLE
        ESM2_150M: DOUBLE
        ESM2_650M: DOUBLE
        SaProt_35M_AF2: DOUBLE
        SaProt_650M_AF2: DOUBLE
        ESM1v_single: DOUBLE
        ESM1v_ensemble: DOUBLE
        ESMC-300M: DOUBLE
      delete_archive: true
  # Published leaderboard, one summary and one per-assay (DMS-level) file per metric, pinned via
  # the commit in `benchmarks_url`. No upstream md5 exists; the commit pin makes the content
  # immutable and the manifest records its sha256 on first fetch. The harness gate (ADR 0010,
  # 0011) compares against all five metrics; its headline is ESM2 (650M) Average_Spearman = 0.414.
  zero_shot_summary_spearman:
    filename: Summary_performance_DMS_substitutions_Spearman.csv
    url: ${data.benchmarks_url}/Spearman/Summary_performance_DMS_substitutions_Spearman.csv
    size_bytes: 43544
    md5: null
    archive: false
  zero_shot_dms_level_spearman:
    filename: DMS_substitutions_Spearman_DMS_level.csv
    url: ${data.benchmarks_url}/Spearman/DMS_substitutions_Spearman_DMS_level.csv
    size_bytes: 138728
    md5: null
    archive: false
  zero_shot_summary_auc:
    filename: Summary_performance_DMS_substitutions_AUC.csv
    url: ${data.benchmarks_url}/AUC/Summary_performance_DMS_substitutions_AUC.csv
    size_bytes: 43560
    md5: null
    archive: false
  zero_shot_dms_level_auc:
    filename: DMS_substitutions_AUC_DMS_level.csv
    url: ${data.benchmarks_url}/AUC/DMS_substitutions_AUC_DMS_level.csv
    size_bytes: 138242
    md5: null
    archive: false
  zero_shot_summary_mcc:
    filename: Summary_performance_DMS_substitutions_MCC.csv
    url: ${data.benchmarks_url}/MCC/Summary_performance_DMS_substitutions_MCC.csv
    size_bytes: 43561
    md5: null
    archive: false
  zero_shot_dms_level_mcc:
    filename: DMS_substitutions_MCC_DMS_level.csv
    url: ${data.benchmarks_url}/MCC/DMS_substitutions_MCC_DMS_level.csv
    size_bytes: 138618
    md5: null
    archive: false
  zero_shot_summary_ndcg:
    filename: Summary_performance_DMS_substitutions_NDCG.csv
    url: ${data.benchmarks_url}/NDCG/Summary_performance_DMS_substitutions_NDCG.csv
    size_bytes: 43549
    md5: null
    archive: false
  zero_shot_dms_level_ndcg:
    filename: DMS_substitutions_NDCG_DMS_level.csv
    url: ${data.benchmarks_url}/NDCG/DMS_substitutions_NDCG_DMS_level.csv
    size_bytes: 138176
    md5: null
    archive: false
  zero_shot_summary_top_recall:
    filename: Summary_performance_DMS_substitutions_Top_recall.csv
    url: ${data.benchmarks_url}/Top_recall/Summary_performance_DMS_substitutions_Top_recall.csv
    size_bytes: 43541
    md5: null
    archive: false
  zero_shot_dms_level_top_recall:
    filename: DMS_substitutions_Top_recall_DMS_level.csv
    url: ${data.benchmarks_url}/Top_recall/DMS_substitutions_Top_recall_DMS_level.csv
    size_bytes: 137549
    md5: null
    archive: false

  # Supervised leaderboard (Spearman of the pooled out-of-fold predictions, ADR 0019), pinned
  # by the same commit. A sanity range for our one-hot and augmented ridges, not a gate: the
  # baselines there use other zero-shot models and another learner (ADR 0021). Saved with a
  # "Supervised_" prefix: upstream's summary has the zero-shot summary's file name.
  supervised_summary_spearman:
    filename: Supervised_Summary_performance_DMS_substitutions_Spearman.csv
    url: ${data.supervised_benchmarks_url}/Spearman/Summary_performance_DMS_substitutions_Spearman.csv
    size_bytes: 7329
    md5: null
