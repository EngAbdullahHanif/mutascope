# ESM-2 150M as an ONNX graph with int8 weights (ADR 0029): `mutascope onnx export` of
# conf/model/esm2_150m.yaml, served by the API on the CPU without PyTorch.
name: esm2_150m_int8
scorer: esm2_onnx
# The ONNX model repo on the Hugging Face Hub, pinned to the published commit (onnx.publish).
hf_id: ${onnx.publish.repo_id}
revision: ${onnx.publish.revision}
file: esm2_150m/int8/model.onnx
tokenizer_file: esm2_150m/tokenizer.json
# The PyTorch config it was exported from, and what the export did to it.
source_model: esm2_150m
precision: int8
# Read the files from an export directory instead of the Hub (checks before a release; no
# cache): model.local_dir=${onnx.export_dir}.
local_dir: null
# ONNX Runtime intra-op threads; null: one per core.
threads: null
# As conf/model/esm2_150m.yaml.
batch_size: 16
window_tokens: 1024
