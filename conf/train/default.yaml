# Supervised cross-validation (`mutascope train cv`, ADR 0019). Per assay and scheme, each of
# ProteinGym's folds is predicted by `model` trained on the other folds, using `feature_set`.
# Names are keys of mutascope.models.registry.MODELS and mutascope.features.base.FEATURE_SETS.
model: training_mean
feature_set: none
# Hyperparameters by model name (mutascope.models.registry); a model not listed takes none.
params:
  ridge:
    # Penalties the inner CV tries, evenly spaced in log10 (loss: sum of squared errors +
    # alpha * |w|^2, penalised dense columns standardised; ADR 0021).
    alphas: {log10_min: -3, log10_max: 6, num: 19}
    unpenalized: []
  augmented_ridge:
    alphas: ${train.params.ridge.alphas}
    # Hsu et al. (2022): the zero-shot score is not shrunk, only the one-hot terms are.
    unpenalized: ["esm2_650m:score"]
  # Gradient-boosted trees (ADR 0022). Per outer fold: `n_trials` Optuna trials (TPE, seeded),
  # each scored by the pooled squared error of an inner CV over the training folds; boosting
  # rounds from the inner curves (early stopping, `patience`); refit on all training rows.
  lgbm:
    n_trials: 10
    # Learning rate >= 0.05 with at most 300 rounds: the pilot's winners (lr >= 0.01, 1,000
    # rounds) took a median 177 rounds, and on one outer fold this is 3.8x faster with test
    # Spearman 0.899 vs 0.901 (SPIKE_SARS2, 3,798 variants; ADR 0022).
    max_rounds: 300
    patience: 30
    seed: ${train.seed}
    # Principal components kept per 1,280-column embedding block, fitted on training rows only;
    # null keeps the raw embedding columns.
    pca_components: null
    # Not searched. One thread per booster: `train cv --jobs` parallelises across assays.
    fixed:
      objective: regression
      metric: l2
      bagging_freq: 1
      num_threads: 1
      deterministic: true
      # Row-wise histograms: identical models, 1.3x faster than column-wise here (ADR 0022).
      force_row_wise: true
      verbose: -1
    # Searched, by LightGBM parameter name: {low, high, log?, int?}.
    search:
      learning_rate: {low: 0.05, high: 0.2, log: true}
      num_leaves: {low: 4, high: 64, log: true, int: true}
      min_data_in_leaf: {low: 5, high: 100, log: true, int: true}
      feature_fraction: {low: 0.1, high: 1.0}
      bagging_fraction: {low: 0.5, high: 1.0}
      lambda_l2: {low: 0.001, high: 10.0, log: true}
  lgbm_pca:
    n_trials: ${train.params.lgbm.n_trials}
    max_rounds: ${train.params.lgbm.max_rounds}
    patience: ${train.params.lgbm.patience}
    seed: ${train.params.lgbm.seed}
    pca_components: 32
    fixed: ${train.params.lgbm.fixed}
    search: ${train.params.lgbm.search}
  # MLP head (ADR 0023). Fixed before any MLP result and never changed after; nothing is searched.
  # LayerNorm -> 512 -> GELU -> Dropout -> 128 -> GELU -> 1 on PCA-reduced, standardised features.
  # Early stopping on one training fold (split like the outer scheme), then refit on all
  # training rows for the chosen epoch count.
  mlp_mse:
    loss: mse
    hidden: [512, 128]
    dropout: 0.2
    # Adam's standard rate (Kingma & Ba, 2015): stable for a 2-layer head without warm-up.
    learning_rate: 1.0e-3
    # PyTorch's AdamW default; dropout and early stopping do most of the regularising.
    weight_decay: 1.0e-2
    # The smallest kept assay (326 variants) still gets 2 updates per epoch, and a RankNet
    # batch holds up to 8,128 pairs.
    batch_size: 128
    # A ceiling, not a target: early stopping ends almost every run first (chosen epochs are
    # written per fold, so hitting it is visible).
    max_epochs: 200
    # 10% of the ceiling: long enough to ride out a noisy validation epoch on ~65 variants.
    patience: 20
    # As lgbm_pca: 32 components per 1,280-column embedding, fitted on training rows only.
    pca_components: 32
    seed: ${train.seed}
  mlp_rank:
    # RankNet pairwise logistic loss, pairs within one assay only (a model is one assay's).
    loss: rank
    hidden: ${train.params.mlp_mse.hidden}
    dropout: ${train.params.mlp_mse.dropout}
    learning_rate: ${train.params.mlp_mse.learning_rate}
    weight_decay: ${train.params.mlp_mse.weight_decay}
    batch_size: ${train.params.mlp_mse.batch_size}
    max_epochs: ${train.params.mlp_mse.max_epochs}
    patience: ${train.params.mlp_mse.patience}
    pca_components: ${train.params.mlp_mse.pca_components}
    seed: ${train.params.mlp_mse.seed}
# Smallest assay (variants) a model is cross-validated on; a model not listed runs on every
# assay. `train cv` skips smaller assays and reports them; `train compare` pairs such a run on the
# assays it has. The MLP's 300 comes from data size and the ridge / LightGBM results only, before
# any MLP result (ADR 0023): below 300 variants both lose to zero-shot SaProt on unseen positions
# (mean -0.20 under contiguous below 200), from 300 up they beat it in every size bin and scheme.
# Skipped assays keep their ridge / LightGBM results.
min_variants:
  mlp_mse: 300
  mlp_rank: 300
# ProteinGym's three schemes (fold_random_5, fold_modulo_5, fold_contiguous_5). Report all three.
schemes: [random, modulo, contiguous]
seed: 0
# Assays `train cv` runs (null: every assay the feature set covers). For pilots and timing runs.
assays: null
# `train cv --jobs N` runs assays in N processes. Memory, not cores, is the limit: ridge on the
# largest `seq_struct` assay (16,897 variants) peaks near 2 GB per worker, and the 13 largest at
# once swapped a 24 GB machine. At most this many variants' assays run at once (ADR 0022).
# Sized for LightGBM (~1 GB per worker on a large assay); use 80000 for ridge on `seq_struct`.
max_variants_in_flight: 160000
# MLflow experiment for supervised runs, next to tracking.experiment (zero-shot).
experiment: supervised
# Label-permutation canary on real models (`mutascope train canary`, ADR 0019 / 0021): the
# assays of tests/models/test_canary.py, judged on the mean permuted pooled Spearman.
canary:
  assays: [ERBB2_HUMAN_Elazar_2016, OTU7A_HUMAN_Tsuboyama_2023_2L2D, NPC1_HUMAN_Erwood_2022_HEK293T]
  n_permutations: 20
  max_standard_errors: 4.0
  # Positive control: below this true-label Spearman the canary cannot vouch for the model,
  # since a model that learns nothing passes trivially. Such cases are reported, not failed.
  min_observed: 0.2
# SHAP of one model fit on all of an assay's variants (`mutascope train shap`, ADR 0022): the
# model's own search, tuned over `scheme`'s folds, then TreeSHAP on every variant. Assays: the
# 5th percentile, median and 98th percentile of size among the 213 structure assays.
shap:
  model: lgbm
  feature_set: seq_struct
  scheme: random
  assays: [SCN5A_HUMAN_Glazer_2019, NUSA_ECOLI_Tsuboyama_2023_1WCL, HSP82_YEAST_Flynn_2019]
  # Blocks shown per assay in the figure (`mutascope train figures`).
  top_blocks: 10
# Prediction intervals (`mutascope train uncertainty` / `train calibrate`, ADR 0024). Fixed before
# any result and never changed after. Per outer fold, CV+ (Barber et al., 2021) is calibrated on
# the training rows only; the outer model gives the point prediction.
uncertainty:
  # The deployment candidate (ADR 0022, 0023). The MLP comparison is an override:
  # train.uncertainty.model=mlp_mse.
  model: ridge
  feature_set: seq_struct
  # Nominal coverages.
  levels: [0.8, 0.9]
  # Calibration folds: random = a seeded random split of the training rows (as many folds as
  # they have); scheme = the training rows' own outer folds (held-out positions under modulo and
  # contiguous). The calibration models' own inner CV uses the same folds.
  modes: [random, scheme]
  # absolute = |residual| (constant width); normalized = |residual| / (spread + epsilon), where
  # spread is the SD of the calibration model's fold ensemble (adaptive width).
  intervals: [absolute, normalized]
  # In units of the training targets' SD (the loop standardises DMS_score). Only guards against
  # a zero spread: 1% of the target SD is below any difference a DMS score resolves, and caps a
  # normalised score at 100x its residual.
  epsilon: 0.01
  seed: ${train.seed}
  # Width-decile bins per assay for the width-vs-error figure.
  width_bins: 10
  # Coverage more than this below the level counts an assay as "below target".
  below_points: 0.10
  # Assay-size bins (variants) for coverage by size; the MLP's minimum (300) is an edge.
  size_edges: [300, 1000, 2000, 5000]
  # Where `train calibrate` writes the all-data calibration rows (gitignored; Task 8 reads them).
  calibration_dir: ${data.processed_dir}/calibration
# Paired bootstrap of pooled Spearman (`mutascope train compare`; ADR 0014): [A, B] by run
# label <model>_<feature_set>. Every supervised model against zero-shot on the same test folds,
# then neighbouring rungs of the ladder.
comparisons:
  - [ridge_site_onehot, zero_shot_esm2_score]
  - [augmented_ridge_site_onehot_esm2, zero_shot_esm2_score]
  - [ridge_seq, zero_shot_esm2_score]
  - [ridge_seq_struct, zero_shot_esm2_score]
  - [ridge_seq_struct, zero_shot_saprot_score]
  - [ridge_seq, augmented_ridge_site_onehot_esm2]
  - [ridge_seq_struct, ridge_seq]
  # LightGBM (ADR 0022): both configurations against ridge and zero-shot on the same folds.
  - [lgbm_seq_struct, ridge_seq_struct]
  - [lgbm_pca_seq_struct, ridge_seq_struct]
  - [lgbm_seq_struct, zero_shot_esm2_score]
  - [lgbm_pca_seq_struct, zero_shot_esm2_score]
  - [lgbm_seq_struct, zero_shot_saprot_score]
  - [lgbm_pca_seq_struct, zero_shot_saprot_score]
  - [lgbm_pca_seq, ridge_seq]
  - [lgbm_pca_seq, zero_shot_esm2_score]
  # With vs without PCA of the embeddings (seq_struct only; lgbm on seq was skipped).
  - [lgbm_seq_struct, lgbm_pca_seq_struct]
  # POST-HOC diagnostic: LightGBM without embeddings (seq_struct_noemb). Not a headline.
  - [lgbm_seq_struct_noemb, lgbm_seq_struct]
  - [lgbm_seq_struct_noemb, lgbm_pca_seq_struct]
  - [lgbm_seq_struct_noemb, ridge_seq_struct]
  # MLP head (ADR 0023), on the assays with at least train.min_variants variants.
  - [mlp_mse_seq_struct, ridge_seq_struct]
  - [mlp_mse_seq_struct, lgbm_pca_seq_struct]
  - [mlp_mse_seq_struct, zero_shot_saprot_score]
  - [mlp_rank_seq_struct, ridge_seq_struct]
  - [mlp_rank_seq_struct, lgbm_pca_seq_struct]
  - [mlp_rank_seq_struct, zero_shot_saprot_score]
  - [mlp_rank_seq_struct, mlp_mse_seq_struct]
# ProteinGym's supervised leaderboard (`mutascope train leaderboard`): run label -> published
# baselines of the same type. A sanity range, not a gate: their features differ (ADR 0021).
leaderboard:
  summary: ${data.raw_dir}/Supervised_Summary_performance_DMS_substitutions_Spearman.csv
  assay_level:
    random: ${data.raw_dir}/Supervised_DMS_substitutions_Spearman_DMS_level_fold_random_5.csv
    modulo: ${data.raw_dir}/Supervised_DMS_substitutions_Spearman_DMS_level_fold_modulo_5.csv
    contiguous: ${data.raw_dir}/Supervised_DMS_substitutions_Spearman_DMS_level_fold_contiguous_5.csv
  baselines:
    ridge_site_onehot: [One-Hot Encodings]
    augmented_ridge_site_onehot_esm2:
      - ESM-1v + One-Hot Encodings
      - DeepSequence + One-Hot Encodings
      - MSA_Transformer + One-Hot Encodings
      - Tranception + One-Hot Encodings
      - TranceptEVE + One-Hot Encodings
