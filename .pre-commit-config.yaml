# ruff and pyright run from the uv env so their versions come from uv.lock, not a second pin here.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Test fixtures are upstream files kept byte-identical (PDB lines are fixed-width).
      - id: trailing-whitespace
        exclude: ^tests/data/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/data/fixtures/
      # pnpm 12 writes its lockfile as several YAML documents; it is generated, never edited.
      - id: check-yaml
        exclude: ^web/pnpm-lock\.yaml$
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
