[project]
name = "mutascope"
version = "0.1.0"
description = "Predict and explore the functional effect of every single amino-acid substitution in a protein."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "biotite>=1.6.0",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "hydra-core>=1.3",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
mutascope = "mutascope.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.7",
    "pyright>=1.1.380",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutascope"]

# --- ruff ---------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "api", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (incl. unused imports)
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "T20", # no print — use structlog
    "PTH", # pathlib over os.path
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["mutascope", "api"]

# --- pyright ------------------------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "api"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# --- pytest -------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
# Slow tests (real 650M models on MPS) only run via `make test-slow`; a later `-m slow` overrides this.
addopts = "-q --strict-markers --import-mode=importlib -m 'not slow'"
markers = [
    "slow: needs real large models / MPS; excluded from `make test`",
]
