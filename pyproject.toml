[project]
name = "mutascope"
version = "0.1.0"
description = "Predict and explore the functional effect of every single amino-acid substitution in a protein."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "biotite>=1.6.0",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "hydra-core>=1.3",
    "lightgbm>=4.7.0",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "pydantic>=2.14",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "structlog>=24.1",
    "threadpoolctl>=3.7.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "typer>=0.12",
]

[project.optional-dependencies]
api = [
    "diskcache>=5.6.3",
    "fastapi>=0.143",
    "limits>=5.8.0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.4",
    "sentry-sdk>=2.72.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.30",
]
notebooks = [
    "altair>=6.3.0",
    "marimo>=0.25.1",
]
tracking = [
    "mlflow>=3.17.0",
]
figures = [
    "matplotlib>=3.11",
]
onnx = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
]

[project.scripts]
mutascope = "mutascope.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.7",
    "pyright>=1.1.380",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.6",
    "schemathesis>=4.31.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutascope"]

# --- ruff ---------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "api", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (incl. unused imports)
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "T20", # no print — use structlog
    "PTH", # pathlib over os.path
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["mutascope", "api"]

# --- pyright ------------------------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "api"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# --- pytest -------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
# The repo root, so `tests` and `api` import as packages whichever test files are collected.
pythonpath = ["."]
# Slow tests (real 650M models on MPS) only run via `make test-slow`; a later `-m slow` overrides this.
# LightGBM tests run in a process of their own (`make test`): on macOS LightGBM's and torch's OpenMP
# runtimes cannot share one (ADR 0022).
addopts = "-q --strict-markers --import-mode=importlib -m 'not slow and not lightgbm'"
markers = [
    "slow: needs real large models / MPS; excluded from `make test`",
    "lightgbm: fits LightGBM; run by `make test` in its own process, never beside torch",
]

# --- uv: CPU-only torch on Linux ------------------------------------------------------------------
# PyPI's Linux torch wheel bundles CUDA (several GB); CI and the Docker image are CPU-only
# (CLAUDE.md "Docker"). macOS wheels come from PyPI and include MPS.

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
