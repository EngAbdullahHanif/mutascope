# Isolated environment for `optimum-cli export onnx`, run by `mutascope onnx export` (ADR 0029).
#
# optimum's ONNX exporter (optimum-onnx 0.1.0, and its main branch on 2026-10-17) requires
# transformers < 4.58, while MutaScope runs transformers 5. The exporter therefore gets its own
# locked environment; the ONNX files it writes are checked against MutaScope's own PyTorch model
# (`mutascope onnx check-parity`), so the two transformers versions must agree for a release.
[project]
name = "mutascope-onnx-export"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "optimum-onnx==0.1.0",
    "torch==2.14.1",
    "transformers==4.57.6",
]

[tool.uv]
package = false
